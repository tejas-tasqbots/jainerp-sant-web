server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker's embedded DNS — re-resolve on each request instead of
    # caching the upstream IP for the worker's lifetime (that cache
    # goes stale if maharaj-api is recreated/redeployed).
    resolver 127.0.0.11 valid=10s;

    # sant-api serves under /api/v1 (added with the sant rename), so the SPA's
    # /api/auth/send-otp becomes http://sant-api:3108/api/v1/auth/send-otp.
    #
    # NOTE: proxy_pass with a variable in the upstream (needed below so Docker's
    # embedded DNS is re-resolved per-request instead of cached for the worker's
    # lifetime) disables nginx's normal automatic prefix-stripping — the location
    # match is NOT removed from the URI in that mode. Do the strip explicitly with
    # rewrite instead, or every request collapses to the literal proxy_pass URI
    # (i.e. every path hits the backend as "/", which is exactly the bug this fixes).
    location /api/ {
        set $sant_api sant-api;
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://$sant_api:3108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Photo uploads served by maharaj-api. Same variable-in-proxy_pass caveat as
    # /api/ above: with a variable upstream, proxy_pass sends the literal URI
    # written here and nothing else — so without the rewrite, EVERY file request
    # (e.g. /uploads/photo123.jpg) reaches the backend as bare "/uploads/".
    location /uploads/ {
        set $sant_api sant-api;
        rewrite ^/uploads/(.*)$ /uploads/$1 break;
        proxy_pass http://$sant_api:3108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Content-hashed build assets (Vite emits /assets/*-[hash].js|css) — the
    # filename changes whenever the content does, so they're safe to cache
    # forever. A missing asset 404s rather than falling back to index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. index.html is NOT content-hashed and points at the current
    # build's hashed assets, so it must never be cached — otherwise a browser
    # keeps loading a stale index.html (and thus the old JS bundle) after a new
    # deploy. This rule was only in mandir-web's config, which is why a favicon
    # and label change deployed here on 2026-08-13 kept showing the old icon:
    # the browser never re-fetched index.html. no-cache = always revalidate, so
    # updates show on the next reload. It also covers the un-hashed root files
    # (favicon.svg, favicon-32.png, apple-touch-icon.png, logo.svg).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
