server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker's embedded DNS — re-resolve on each request instead of
    # caching the upstream IP for the worker's lifetime (that cache
    # goes stale if maharaj-api is recreated/redeployed).
    resolver 127.0.0.11 valid=10s;

    # maharaj-api has NO global prefix; strip /api before forwarding
    # /api/auth/send-otp -> http://maharaj-api:3108/auth/send-otp
    location /api/ {
        set $maharaj_api maharaj-api;
        proxy_pass http://$maharaj_api:3108/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Photo uploads served by maharaj-api
    location /uploads/ {
        set $maharaj_api maharaj-api;
        proxy_pass http://$maharaj_api:3108/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
